<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>200 Mini Games — ArcadeZone</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .mini-header { text-align: center; padding: 2rem 1rem 1rem; }
    .mini-header h1 { font-size: 2rem; color: var(--neon-pink); }
    .mini-header p { color: var(--text-dim); margin-top: 0.5rem; }
    .search-bar { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; padding: 1rem; max-width: 800px; margin: 0 auto; }
    .search-bar input { flex: 1; min-width: 200px; padding: 0.7rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-input); color: var(--text); font-size: 1rem; outline: none; }
    .search-bar input:focus { border-color: var(--neon-blue); }
    .filter-tabs { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; padding: 0.5rem 1rem; }
    .filter-tab { padding: 0.4rem 0.8rem; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-card); color: var(--text-dim); cursor: pointer; transition: all 0.3s; font-size: 0.8rem; }
    .filter-tab:hover { border-color: var(--neon-blue); color: var(--text); }
    .filter-tab.active { background: var(--neon-blue); color: var(--bg-dark); border-color: var(--neon-blue); font-weight: 600; }
    .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .mini-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 0.8rem; text-align: center; transition: all 0.3s; cursor: pointer; text-decoration: none; color: var(--text); display: block; }
    .mini-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,212,255,0.15); border-color: var(--neon-blue); color: var(--text); }
    .mini-card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .mini-card h4 { font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--neon-blue); line-height: 1.3; }
    .mini-card .engine-tag { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .game-count { text-align: center; color: var(--text-dim); padding: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">🎮 ARCADE<span>ZONE</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/mini/">Mini Games</a>
      <a href="/leaderboard">Leaderboard</a>
      <a href="/admin">Admin</a>
    </div>
    <div class="player-area">
      <span id="playerName">Guest</span>
      <button class="btn btn-sm" onclick="showLogin()">Login</button>
    </div>
  </nav>

  <div class="mini-header">
    <h1>🎮 200 Mini Games</h1>
    <p>Play 200 free browser games — no download needed!</p>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search games..." oninput="filterGames()">
  </div>

  <div class="filter-tabs" id="filterTabs">
    <div class="filter-tab active" data-engine="all" onclick="setFilter('all', this)">All (200)</div>
    <div class="filter-tab" data-engine="clicker" onclick="setFilter('clicker', this)">🎯 Clicker</div>
    <div class="filter-tab" data-engine="dodge" onclick="setFilter('dodge', this)">💨 Dodge</div>
    <div class="filter-tab" data-engine="catch" onclick="setFilter('catch', this)">🧺 Catch</div>
    <div class="filter-tab" data-engine="runner" onclick="setFilter('runner', this)">🏃 Runner</div>
    <div class="filter-tab" data-engine="memory" onclick="setFilter('memory', this)">🧠 Memory</div>
    <div class="filter-tab" data-engine="timing" onclick="setFilter('timing', this)">⏱️ Timing</div>
    <div class="filter-tab" data-engine="puzzle" onclick="setFilter('puzzle', this)">🧩 Puzzle</div>
  </div>

  <div class="game-count" id="gameCount">Showing 200 games</div>

  <div class="mini-grid" id="gamesGrid"></div>

  <footer>
    <p>&copy; 2026 ArcadeZone. All rights reserved.</p>
  </footer>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2>Enter Your Nickname</h2>
      <input type="text" id="nicknameInput" placeholder="Your nickname..." maxlength="20">
      <div class="modal-actions">
        <button class="btn" onclick="submitLogin()">Play!</button>
        <button class="btn btn-secondary" onclick="closeLogin()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/mini/games-data.js"></script>
  <script>
    // Player management
    const player = JSON.parse(localStorage.getItem('arcade_player') || 'null');
    if (player) {
      document.getElementById('playerName').textContent = player.nickname;
      document.querySelector('.btn-sm').style.display = 'none';
    }
    function showLogin() { document.getElementById('loginModal').classList.add('active'); }
    function closeLogin() { document.getElementById('loginModal').classList.remove('active'); }
    async function submitLogin() {
      const nick = document.getElementById('nicknameInput').value.trim();
      if (!nick) return;
      const res = await fetch('/api/player', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nickname: nick }) });
      const data = await res.json();
      localStorage.setItem('arcade_player', JSON.stringify(data));
      document.getElementById('playerName').textContent = data.nickname;
      document.querySelector('.btn-sm').style.display = 'none';
      closeLogin();
    }

    // Game listing
    let currentFilter = 'all';

    function renderGames(games) {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = games.map(g =>
        `<a href="/mini/play.html?id=${g.id}" class="mini-card">
          <div class="icon">${g.icon}</div>
          <h4>${g.name}</h4>
          <div class="engine-tag">${g.engine}</div>
        </a>`
      ).join('');
      document.getElementById('gameCount').textContent = `Showing ${games.length} games`;
    }

    function filterGames() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = GAMES_DATA;
      if (currentFilter !== 'all') filtered = filtered.filter(g => g.engine === currentFilter);
      if (search) filtered = filtered.filter(g => g.name.toLowerCase().includes(search) || g.description.toLowerCase().includes(search));
      renderGames(filtered);
    }

    function setFilter(engine, el) {
      currentFilter = engine;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      filterGames();
    }

    // Init
    renderGames(GAMES_DATA);
  </script>
</body>
</html>
